services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tiv_songs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [tiv_songs_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiv_songs"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tiv_songs_data:
